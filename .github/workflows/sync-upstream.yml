name: Sync upstream and rename curated channel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/openai/plugins.git
          git fetch upstream main --prune
          git checkout main
          git merge --no-edit -X theirs upstream/main

      - name: Rename curated channel
        env:
          OLD_VALUE: openai-curated
          NEW_VALUE: codexplusplus-openai-curated
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          old = os.environ["OLD_VALUE"]
          new = os.environ["NEW_VALUE"]
          skipped_dirs = {".git", ".github"}
          skipped_paths = {Path("scripts/sync-upstream-and-rename.ps1")}

          rename_pattern = None
          if new != old and new.endswith(old):
              prefix = new[: -len(old)]
              rename_pattern = re.compile(rf"(?:{re.escape(prefix)})*{re.escape(old)}")

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skipped_dirs for part in path.parts):
                  continue
              if path in skipped_paths:
                  continue

              data = path.read_bytes()
              if b"\0" in data:
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              if rename_pattern:
                  updated = rename_pattern.sub(new, text)
              else:
                  updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "Sync upstream and rename curated channel"
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin main
          else
            echo "No changes to push."
          fi
